name: calculator_bintang
description: Bintang Calculator - a simple calculator built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Parser ekspresi matematika untuk mengevaluasi input pengguna.
  math_expressions: ^2.4.0
  # Menyimpan riwayat perhitungan agar tidak hilang saat aplikasi ditutup.
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
